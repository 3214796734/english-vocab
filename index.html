<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语四六级词汇学习</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  min-height:100vh;
}

.header{
  background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.2);
  padding:30px 0 0;text-align:center;color:#fff;
}
.header h1{font-size:2rem;margin-bottom:6px;letter-spacing:2px;}
.header p{font-size:0.95rem;opacity:0.85;margin-bottom:20px;}

.tabs{display:flex;justify-content:center;gap:6px;padding:0 20px;}
.tab{
  padding:12px 40px;border:none;background:rgba(255,255,255,0.15);
  color:rgba(255,255,255,0.8);cursor:pointer;border-radius:10px 10px 0 0;
  font-size:1rem;font-weight:600;transition:all 0.25s;letter-spacing:1px;
}
.tab:hover{background:rgba(255,255,255,0.25);color:#fff;}
.tab.active{background:#fff;color:#667eea;}

.container{max-width:800px;margin:0 auto;padding:24px;}

.stats-bar{display:flex;justify-content:center;gap:32px;flex-wrap:wrap;margin-bottom:20px;}
.stat{
  background:rgba(255,255,255,0.15);backdrop-filter:blur(6px);
  border-radius:12px;padding:14px 28px;color:#fff;text-align:center;
}
.stat-num{font-size:1.8rem;font-weight:700;}
.stat-label{font-size:0.85rem;opacity:0.8;margin-top:2px;}

.toolbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:400px;}
.search-wrap input{
  width:100%;padding:10px 40px 10px 16px;border:2px solid transparent;border-radius:24px;
  font-size:0.95rem;background:#fff;outline:none;transition:all 0.25s;
}
.search-wrap input:focus{border-color:#667eea;box-shadow:0 0 0 4px rgba(102,126,234,0.2);}
.search-wrap .search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#999;pointer-events:none;}

.filter-btn{
  padding:8px 18px;border:2px solid rgba(255,255,255,0.5);
  background:transparent;color:#fff;border-radius:24px;cursor:pointer;
  font-size:0.85rem;font-weight:600;transition:all 0.2s;white-space:nowrap;
}
.filter-btn:hover{border-color:#fff;background:rgba(255,255,255,0.15);}
.filter-btn.active{background:#fff;color:#667eea;border-color:#fff;}

.mode-btn{
  padding:8px 18px;border:2px solid #fbbf24;background:#fbbf24;
  color:#1a202c;border-radius:24px;cursor:pointer;font-size:0.85rem;font-weight:600;
  transition:all 0.2s;white-space:nowrap;
}
.mode-btn:hover{background:#f59e0b;border-color:#f59e0b;}

/* Word list rows */
.word-list{display:flex;flex-direction:column;gap:4px;}
.word-row{
  display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,0.95);border-radius:10px;
  padding:10px 16px;cursor:pointer;transition:all 0.15s;
  user-select:none;
}
.word-row:hover{background:#fff;transform:translateX(4px);box-shadow:0 2px 12px rgba(0,0,0,0.1);}
.word-row .row-en{
  font-weight:700;color:#2d3748;font-size:1rem;min-width:110px;max-width:180px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;
}
.word-row .row-zh{
  color:#4a5568;font-size:0.9rem;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.word-row .row-speak{
  width:28px;height:28px;border:none;background:#ebf4ff;color:#3182ce;
  border-radius:50%;cursor:pointer;font-size:0.8rem;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;z-index:2;
}
.word-row .row-speak:hover{background:#3182ce;color:#fff;}
.word-row .row-badges{display:flex;gap:4px;flex-shrink:0;white-space:nowrap;}
.word-row .badge{font-size:0.68rem;padding:2px 8px;border-radius:12px;font-weight:600;white-space:nowrap;}
.badge-cet4{background:#ebf4ff;color:#3182ce;}
.badge-cet6{background:#faf5ff;color:#805ad5;}
.badge-count{background:#fffbea;color:#975a16;}

/* Study mode overlay */
.overlay{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.7);z-index:100;justify-content:center;align-items:center;
}
.overlay.active{display:flex;}

.study-card{
  background:#fff;border-radius:20px;padding:40px 48px;max-width:500px;width:90%;
  text-align:center;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
.study-close{
  position:absolute;top:12px;right:16px;border:none;background:none;
  font-size:1.5rem;cursor:pointer;color:#a0aec0;
}
.study-close:hover{color:#4a5568;}
.study-en{font-size:2.2rem;font-weight:700;color:#2d3748;margin-bottom:8px;}
.study-zh{font-size:1.3rem;color:#4a5568;margin-bottom:8px;}
.study-simple{font-size:0.95rem;color:#718096;margin-bottom:4px;}
.study-count{font-size:0.9rem;color:#975a16;margin-bottom:16px;}
.study-speak{
  width:48px;height:48px;border:none;background:#ebf4ff;color:#3182ce;
  border-radius:50%;cursor:pointer;font-size:1.3rem;margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center;transition:all 0.2s;
}
.study-speak:hover{background:#3182ce;color:#fff;transform:scale(1.1);}
.study-speak.speaking{background:#3182ce;color:#fff;animation:pulse 0.8s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

.study-nav{display:flex;justify-content:space-between;align-items:center;gap:16px;}
.nav-btn{
  padding:10px 24px;border:2px solid #e2e8f0;background:#fff;
  border-radius:12px;cursor:pointer;font-size:0.9rem;font-weight:600;
  color:#4a5568;transition:all 0.2s;
}
.nav-btn:hover{background:#667eea;color:#fff;border-color:#667eea;}
.nav-btn:disabled{opacity:0.3;cursor:default;}
.nav-btn:disabled:hover{background:#fff;color:#4a5568;border-color:#e2e8f0;}
.study-progress{color:#a0aec0;font-size:0.85rem;}

.empty{text-align:center;color:rgba(255,255,255,0.8);padding:60px 20px;}
.empty-icon{font-size:3rem;margin-bottom:12px;}
.empty-text{font-size:1.1rem;}

.footer{text-align:center;padding:30px;color:rgba(255,255,255,0.5);font-size:0.85rem;}

.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap;}
.page-btn{
  padding:8px 16px;border:2px solid rgba(255,255,255,0.5);
  background:transparent;color:#fff;border-radius:8px;cursor:pointer;
  font-size:0.9rem;font-weight:600;transition:all 0.2s;
}
.page-btn:hover:not(:disabled){border-color:#fff;background:rgba(255,255,255,0.15);}
.page-btn:disabled{opacity:0.4;cursor:default;}
.page-btn.active{background:#fff;color:#667eea;border-color:#fff;}
.page-info{color:rgba(255,255,255,0.8);font-size:0.9rem;padding:0 8px;}

@media(max-width:600px){
  .tab{padding:10px 16px;font-size:0.85rem;}
  .container{padding:12px;}
  .word-row{gap:6px;padding:8px 10px;}
  .word-row .row-en{min-width:80px;max-width:120px;font-size:0.85rem;}
  .word-row .row-zh{font-size:0.78rem;}
  .study-en{font-size:1.6rem;}
  .study-card{padding:28px 24px;}
}
</style>
</head>
<body>

<div class="header">
  <h1>英语四六级词汇学习</h1>
  <p>CET-4 &amp; CET-6 Vocabulary</p>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('cet4')">CET-4 (1239词)</button>
    <button class="tab" onclick="switchTab('cet6')">CET-6 (1004词)</button>
  </div>
</div>

<div class="container">
  <div class="stats-bar">
    <div class="stat"><div class="stat-num" id="totalCount">0</div><div class="stat-label">总词汇</div></div>
    <div class="stat"><div class="stat-num" id="highCount">0</div><div class="stat-label">高频(10+次)</div></div>
    <div class="stat"><div class="stat-num" id="midCount">0</div><div class="stat-label">中频(3-10次)</div></div>
    <div class="stat"><div class="stat-num" id="lowCount">0</div><div class="stat-label">低频(1-2次)</div></div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="搜索英文 / 中文…" oninput="render(1)">
      <span class="search-icon">🔍</span>
    </div>
    <button class="filter-btn active" data-freq="all" onclick="setFreq('all',this)">全部</button>
    <button class="filter-btn" data-freq="high" onclick="setFreq('high',this)">高频</button>
    <button class="filter-btn" data-freq="mid" onclick="setFreq('mid',this)">中频</button>
    <button class="filter-btn" data-freq="low" onclick="setFreq('low',this)">低频</button>
    <button class="mode-btn" onclick="startStudy()" title="进入逐词学习模式">📖 学习模式</button>
  </div>

  <div class="word-list" id="wordList"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="empty-icon">📭</div>
    <div class="empty-text">没找到匹配的词汇</div>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<!-- Study Mode Overlay -->
<div class="overlay" id="studyOverlay">
  <div class="study-card" id="studyCard">
    <button class="study-close" onclick="closeStudy()">✕</button>
    <div class="study-en" id="studyEn"></div>
    <div class="study-zh" id="studyZh"></div>
    <div class="study-simple" id="studySimple"></div>
    <div class="study-count" id="studyCount"></div>
    <button class="study-speak" id="studySpeakBtn" onclick="speakStudy()">🔈</button>
    <div class="study-nav">
      <button class="nav-btn" id="prevBtn" onclick="prevWord()">← 上一个</button>
      <span class="study-progress" id="studyProgress"></span>
      <button class="nav-btn" id="nextBtn" onclick="nextWord()">下一个 →</button>
    </div>
  </div>
</div>

<div class="footer">点击词汇进入学习模式 · 键盘 ← → 翻页 · Esc 退出</div>

<script src="data.js?v=5"></script>
<script>
var currentTab = 'cet4';
var currentFreq = 'all';
var currentPage = 1;
var PAGE_SIZE = 50;
var speechSynth = window.speechSynthesis;
var speakingWord = null;
var studyWords = [];
var studyIndex = 0;

var simpleTemplates = {
  "abandon":"to leave behind or give up completely",
  "ability":"the power or skill to do something",
  "abroad":"in or to a foreign country",
  "absent":"not present in a place",
  "absolute":"total and complete, without any limits",
  "absorb":"to take in liquid, heat, or light",
  "abstract":"based on ideas, not physical things",
  "abundant":"more than enough; in large quantities",
  "abuse":"to use something in a bad or harmful way",
  "academic":"relating to education and schools",
  "accelerate":"to go faster or make faster",
  "access":"the right to enter or use something",
  "accompany":"to go somewhere with someone",
  "accomplish":"to succeed in doing something",
  "account":"a record of money; a report",
  "accurate":"exactly right; without mistakes",
  "achieve":"to reach a goal by working hard",
  "acquire":"to get or gain over time",
  "adapt":"to change to fit a new situation",
  "adequate":"enough for what you need",
  "adjust":"to make small changes to fit better",
  "admire":"to respect and like very much",
  "admit":"to agree something bad is true",
  "adopt":"to start using a new method",
  "advance":"to move forward or make progress",
  "advantage":"something that helps you do better",
  "adventure":"an exciting and risky experience",
  "affair":"an event or situation",
  "affect":"to cause a change or influence",
  "afford":"to have enough money to pay for",
  "aggressive":"ready to attack or fight",
  "agreement":"a promise made by people",
  "aid":"help or support",
  "alarm":"a loud warning sound",
  "alter":"to make something different",
  "alternative":"another way or choice",
  "amaze":"to surprise very much",
  "ambition":"a strong desire to achieve",
  "amount":"how much there is of something",
  "analysis":"the careful study of something",
  "analyze":"to study carefully",
  "ancient":"very old; from a long time ago",
  "announce":"to tell people publicly",
  "annual":"happening once every year",
  "anxiety":"a feeling of worry",
  "anxious":"worried",
  "apart":"not together; separated",
  "apologize":"to say sorry",
  "apparent":"easy to see or understand",
  "appeal":"to make a serious request",
  "application":"a formal request",
  "apply":"to ask for formally; to use",
  "appreciate":"to be thankful",
  "approach":"to come near; a way of dealing",
  "appropriate":"right for a situation",
  "approve":"to officially agree",
  "argue":"to disagree and talk angrily",
  "arise":"to happen or start to exist",
  "arrange":"to plan or organize",
  "article":"a piece of writing",
  "artificial":"made by people, not natural",
  "aspect":"one part of a situation",
  "assess":"to judge the value of",
  "asset":"something valuable you have",
  "assign":"to give a job to do",
  "assist":"to help someone",
  "associate":"to connect in your mind",
  "assume":"to think without proof",
  "atmosphere":"the feeling of a place",
  "attach":"to join things together",
  "attempt":"to try to do something hard",
  "attend":"to be present at an event",
  "attention":"careful thought to something",
  "attitude":"how you think and feel",
  "attract":"to make people want to come",
  "audience":"people watching or listening",
  "authority":"the power to make decisions",
  "available":"ready to be used",
  "average":"normal or typical",
  "avoid":"to stay away from something bad",
  "award":"a prize for doing well",
  "aware":"knowing something exists",
  "awful":"very bad or unpleasant",
};

function getSimple(en) {
  var key = en.toLowerCase();
  return simpleTemplates[key] || '';
}

function switchTab(tab) {
  currentTab = tab; currentFreq = 'all'; currentPage = 1;
  document.querySelectorAll('.tab').forEach(function(t,i){ t.classList.toggle('active', i===(tab==='cet4'?0:1)); });
  document.querySelectorAll('.filter-btn').forEach(function(b,i){ b.classList.toggle('active', i===0); });
  document.getElementById('searchInput').value = '';
  render(1);
}

function setFreq(freq, btn) {
  currentFreq = freq; currentPage = 1;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  render(1);
}

function getWords() {
  return currentTab === 'cet4' ? cet4Words : cet6Words;
}

function getFilteredWords() {
  var search = document.getElementById('searchInput').value.trim().toLowerCase();
  var words = getWords();
  if (search) words = words.filter(function(w){ return w.en.toLowerCase().indexOf(search)!==-1 || w.zh.indexOf(search)!==-1; });
  if (currentFreq !== 'all') words = words.filter(function(w){ return w.freq === currentFreq; });
  words.sort(function(a,b){ return (b.examCount||0) - (a.examCount||0); });
  return words;
}

// Use Youdao TTS API for reliable playback on all browsers (WeChat, Safari, etc.)
// Returns MP3 audio directly — no SpeechSynthesis dependency
// TTS: multiple sources for reliability
// Primary: local MP3 files (same origin, works everywhere incl. WeChat)
// Fallback: external TTS APIs
var ttsSources = [
  function(en){ return 'audio/' + en + '.mp3'; },
  function(en){ return 'https://fanyi.baidu.com/gettts?lan=en&text=' + encodeURIComponent(en) + '&spd=3'; },
  function(en){ return 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(en) + '&type=0'; }
];
var ttsIdx = 0;

var currentAudio = null;

function doSpeak(en, onEnd) {
  speechSynth.cancel();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }

  ttsIdx = 0;
  function tryNext(){
    if (ttsIdx >= ttsSources.length) {
      // All failed, try SpeechSynthesis
      var u = new SpeechSynthesisUtterance(en);
      u.lang = 'en-US'; u.rate = 0.9;
      u.onend = function(){ if (onEnd) onEnd(); };
      u.onerror = function(){ if (onEnd) onEnd(); };
      speechSynth.speak(u);
      setTimeout(function(){ if (onEnd) onEnd(); }, 5000);
      return;
    }
    var url = ttsSources[ttsIdx](en);
    ttsIdx++;
    var a = new Audio();
    a.src = url;
    a.volume = 1;
    currentAudio = a;
    a.onended = function(){ currentAudio = null; if (onEnd) onEnd(); };
    a.onerror = function(){ currentAudio = null; tryNext(); };
    var p = a.play();
    if (p && p.then) { p.catch(function(){ tryNext(); }); }
  }
  tryNext();
  setTimeout(function(){ if (onEnd) onEnd(); }, 10000);
}

function speak(e, en) {
  e.stopPropagation();
  if (speakingWord === en) {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    speakingWord = null; render(currentPage); return;
  }
  speakingWord = en;
  render(currentPage);
  doSpeak(en, function(){ speakingWord = null; render(currentPage); });
}

// Study Mode
function startStudy() {
  studyWords = getFilteredWords();
  studyIndex = 0;
  if (studyWords.length === 0) return;
  document.getElementById('studyOverlay').classList.add('active');
  showStudyWord();
}

function closeStudy() {
  document.getElementById('studyOverlay').classList.remove('active');
  render(currentPage);
}

function showStudyWord() {
  var w = studyWords[studyIndex];
  document.getElementById('studyEn').textContent = w.en;
  document.getElementById('studyZh').textContent = w.zh;
  var simple = w.simple || getSimple(w.en);
  document.getElementById('studySimple').textContent = simple;
  document.getElementById('studyCount').textContent = '📋 真题出现 ' + (w.examCount||0) + ' 次';
  document.getElementById('studyProgress').textContent = (studyIndex+1) + ' / ' + studyWords.length;
  document.getElementById('prevBtn').disabled = studyIndex === 0;
  document.getElementById('nextBtn').disabled = studyIndex >= studyWords.length - 1;
  // Don't auto-speak — mobile requires user gesture
  var btn = document.getElementById('studySpeakBtn');
  btn.classList.remove('speaking');
  btn.textContent = '🔈';
}

function nextWord() {
  if (studyIndex < studyWords.length - 1) { studyIndex++; showStudyWord(); }
}

function prevWord() {
  if (studyIndex > 0) { studyIndex--; showStudyWord(); }
}

function speakStudy() {
  var w = studyWords[studyIndex];
  var btn = document.getElementById('studySpeakBtn');
  btn.classList.add('speaking'); btn.textContent = '🔊';
  doSpeak(w.en, function(){
    btn.classList.remove('speaking'); btn.textContent = '🔈';
  });
}

function openStudy(index) {
  studyWords = getFilteredWords();
  studyIndex = index;
  document.getElementById('studyOverlay').classList.add('active');
  showStudyWord();
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  var overlay = document.getElementById('studyOverlay');
  if (overlay.classList.contains('active')) {
    if (e.key === 'ArrowRight') nextWord();
    else if (e.key === 'ArrowLeft') prevWord();
    else if (e.key === 'Escape') closeStudy();
    return;
  }
  if (e.key === 'ArrowRight' && !e.target.closest('input')) render(currentPage + 1);
  if (e.key === 'ArrowLeft' && !e.target.closest('input')) render(currentPage - 1);
});

function render(page) {
  currentPage = page;
  var words = getFilteredWords();
  var totalPages = Math.ceil(words.length / PAGE_SIZE);
  var start = (page - 1) * PAGE_SIZE;
  if (start < 0) start = 0;
  if (page < 1) page = 1;
  if (page > totalPages) page = totalPages;
  currentPage = page;
  start = (page - 1) * PAGE_SIZE;
  var pageWords = words.slice(start, start + PAGE_SIZE);

  var list = document.getElementById('wordList');
  var empty = document.getElementById('emptyState');

  if (pageWords.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    var isCet4 = currentTab === 'cet4';
    var levelBadge = isCet4 ? '<span class="badge badge-cet4">CET-4</span>' : '<span class="badge badge-cet6">CET-6</span>';

    list.innerHTML = pageWords.map(function(w, i){
      var examCount = w.examCount || 0;
      var countBadge = examCount ? '<span class="badge badge-count">📋' + examCount + '次</span>' : '';
      var globalIndex = start + i;
      var safeEn = w.en.replace(/'/g, "\\'");
      return '<div class="word-row" onclick="openStudy(' + globalIndex + ')">' +
        '<button class="row-speak" onclick="speak(event,\'' + safeEn + '\')">🔊</button>' +
        '<span class="row-en">' + w.en + '</span>' +
        '<span class="row-zh">' + w.zh + '</span>' +
        '<div class="row-badges">' + levelBadge + countBadge + '</div>' +
      '</div>';
    }).join('');
  }

  var pag = document.getElementById('pagination');
  if (totalPages <= 1) {
    pag.innerHTML = '';
  } else {
    var html = '<button class="page-btn" onclick="render(' + (page-1) + ')" ' + (page<=1?'disabled':'') + '>上一页</button>';
    html += '<span class="page-info">' + page + ' / ' + totalPages + '</span>';
    if (page > 3) html += '<button class="page-btn" onclick="render(1)">1</button><span class="page-info">…</span>';
    for (var i = Math.max(1, page-1); i <= Math.min(totalPages, page+1); i++) {
      html += '<button class="page-btn' + (i===page?' active':'') + '" onclick="render(' + i + ')">' + i + '</button>';
    }
    if (page < totalPages - 2) html += '<span class="page-info">…</span><button class="page-btn" onclick="render(' + totalPages + ')">' + totalPages + '</button>';
    html += '<button class="page-btn" onclick="render(' + (page+1) + ')" ' + (page>=totalPages?'disabled':'') + '>下一页</button>';
    pag.innerHTML = html;
  }

  var allWords = getWords();
  document.getElementById('totalCount').textContent = allWords.length;
  document.getElementById('highCount').textContent = allWords.filter(function(w){return w.freq==='high';}).length;
  document.getElementById('midCount').textContent = allWords.filter(function(w){return w.freq==='mid';}).length;
  document.getElementById('lowCount').textContent = allWords.filter(function(w){return w.freq==='low';}).length;
}

render(1);
</script>

</body>
</html>
